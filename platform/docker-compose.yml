services:
  mongo:
    image: mongo:4.4
    volumes:
      - mongo-data:/data/db
    networks:
      - data-net
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - mongo
        - --quiet
        - --eval
        - db.adminCommand("ping").ok
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    expose:
      - "5000"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - data-net
      - app-net
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:5000/health", timeout=5)
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    ports:
      - "${AIED_HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-net
    restart: unless-stopped

volumes:
  mongo-data:

networks:
  data-net:
    internal: true
  app-net:
